  #     - key: PYTHON_VERSION
  #       value: "3.12.4"
  #     - key: ENV
  #       value: production
  #     - key: ALLOWED_ORIGINS
  #       value: "*"
  #     - key: AI_DAILY_LIMIT          # trial tier
  #       value: "10"
  #     - key: AI_FREE_DAILY_LIMIT     # post-trial free tier
  #       value: "3"
  #     - key: AI_PRO_DAILY_LIMIT      # pro tier
  #       value: "20"
  #     # See the note on the staging block: FREE_SAVE_LIMIT is an override that
  #     # exists only until billing ships. PROD SHOULD NOT CARRY IT — prod going
  #     # live implies a working purchase flow, which is exactly the condition
  #     # that makes the real 50 correct.
  #     - key: PRO_SAVE_LIMIT          # trial + pro
  #       value: "500"
  #     - key: ANTHROPIC_API_KEY
  #       sync: false
  #     - key: DATABASE_URL          # SaveHere prod SESSION POOLER (:5432)
  #       sync: false
  #     - key: SUPABASE_URL
  #       sync: false
  #     - key: SUPABASE_SERVICE_ROLE_KEY
  #       sync: false
