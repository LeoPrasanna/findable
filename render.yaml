# Render Blueprint — deploys the SaveHere FastAPI backend.
#   • savehere-api-staging  ← from `develop`, uses the savehere-dev Supabase project. ACTIVE (free tier).
#   • savehere-api-prod     ← from `main`,    uses the SaveHere (prod) project. DEFERRED — commented out
#     below so the blueprint stays free-tier (a paid plan forces a card at apply). Re-enable at launch.
# Deploys are CI-gated: Render autoDeploy is OFF, and .github/workflows/ci.yml fires the deploy hook
# only after backend tests pass (see that file). The first deploy still runs on blueprint apply.
#
# Render → New → Blueprint → connect this repo; Render reads this file and proposes
# the staging service. Its SECRETS are set in the dashboard Environment tab
# (sync:false = not stored in git). Point each at the matching Supabase project +
# Postgres pooler — see docs/ENVIRONMENTS.md for the full per-env matrix, and
# docs/DEPLOY.md for the walkthrough and caveats.
#
# ⚠️ DATABASE_URL is sync:false and MUST be set in EACH service. Unset → the app
# falls back to SQLite on Render's EPHEMERAL disk, wiped on every redeploy (total
# data loss). Use the Supabase SESSION POOLER string (port 5432, IPv4) — the direct
# string is IPv6-only and the transaction pooler (6543) breaks prepared statements.

services:
  # ── STAGING ────────────────────────────────────────────────────────────────
  - type: web
    name: savehere-api-staging
    runtime: python
    rootDir: backend
    branch: develop
    plan: free                      # free = cold-starts after ~15m idle; fine for staging
    # Force-upgrade yt-dlp on every build — YouTube changes regularly break older
    # versions, and this is the single biggest factor in save success rate.
    buildCommand: pip install -r requirements.txt && pip install -U --no-cache-dir yt-dlp
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false               # CI-gated: deploys fire from .github/workflows/ci.yml's hook AFTER tests pass, not on raw push
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: ENV
        value: staging
      # The deployed web app's origin(s), comma-separated. "*" works for a first
      # deploy; tighten to the real staging domain once the web app is hosted.
      - key: ALLOWED_ORIGINS
        value: "*"
      # ── AI quota knobs — per-tier daily AI actions. Editable here or in the
      #    Render dashboard to retune the budget WITHOUT a code deploy (config.py
      #    reads these; unset falls back to its defaults). ─────────────────────────
      - key: AI_DAILY_LIMIT          # trial tier
        value: "10"
      - key: AI_FREE_DAILY_LIMIT     # post-trial free tier
        value: "3"
      - key: AI_PRO_DAILY_LIMIT      # pro tier
        value: "20"
      # ── Save caps — total saves per tier (backend/app/config.py).
      #
      # The 500 free override is GONE (owner, 2026-09-13): free is the real 50.
      # Both keys are now stated explicitly rather than leaning on the code
      # default, because a cap that silently changes with a code edit is the
      # wrong kind of surprise for the one number that can refuse a save.
      #
      # ⚠️ NOTHING CHARGES YET. app/pro.tsx renders a paywall and RevenueCat
      # does not exist, so a free user who hits 50 gets a 403 offering a product
      # they cannot buy. That is the owner's accepted trade — testing the real
      # wall matters more than hiding it. Ship billing before real users arrive.
      - key: FREE_SAVE_LIMIT         # code default: 50
        value: "50"
      - key: PRO_SAVE_LIMIT          # trial + pro
        value: "500"
      # ── Secrets — set in THIS service's dashboard (savehere-dev project) ──────
      - key: ANTHROPIC_API_KEY
        sync: false
      # ⚠️ REQUIRED — savehere-dev SESSION POOLER (:5432). Unset = ephemeral SQLite.
      - key: DATABASE_URL
        sync: false
      # Backend needs these for auth: JWKS token verification (app/auth.py), admin
      # account-deletion + tier writes (routes/account.py), the billing webhook
      # (routes/billing.py). SUPABASE_JWKS_URL is auto-derived from SUPABASE_URL.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY        # optional (Whisper transcription)
        sync: false
      - key: APIFY_API_KEY         # optional (LinkedIn scraper)
        sync: false
      - key: SENTRY_DSN            # optional (error monitoring; empty = disabled)
        sync: false

  # ── PRODUCTION (deferred until launch — commented out on purpose) ───────────
  # Kept out of the active blueprint so it stays 100% free-tier for now: a paid
  # `plan: starter` service forces a credit card at blueprint apply. Re-enable at
  # launch (with a card + Supabase Pro) by uncommenting this block. It's identical
  # to savehere-api-staging above except: name, branch: main, plan: starter,
  # ENV=production. Point its secrets at the SaveHere (prod) project, not dev.
  # - type: web
  #   name: savehere-api-prod
  #   runtime: python
  #   rootDir: backend
  #   branch: main
  #   plan: starter                 # always-on (~$7/mo)
  #   buildCommand: pip install -r requirements.txt && pip install -U --no-cache-dir yt-dlp
  #   startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
  #   healthCheckPath: /health
  #   autoDeploy: false             # CI-gated via .github/workflows/ci.yml
