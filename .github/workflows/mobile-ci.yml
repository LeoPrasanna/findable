# Typechecks the mobile app on every push/PR touching mobile code.
# A `launch-prep` branch once shipped commits where app/index.tsx didn't even
# parse (the home screen was broken); this 1-2 min job catches that class of
# break before it reaches develop. Separate from the backend workflow so a
# mobile-only change doesn't run the Python suite (and vice versa).
name: Mobile CI

on:
  push:
    branches: [develop]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"

jobs:
  mobile-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # ⚠️ 22, not 20. The services/ self-checks below run through
          # `node --experimental-strip-types`, which does not exist before
          # 22.6 — on 20 it is a hard `bad option` exit, not a skip. The repo's
          # test scripts have required 22 since they were written; CI just never
          # ran them, so nothing surfaced it until 2026-08-14.
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        # `npm ci` installs exactly from the committed lockfile (reproducible, no
        # surprise upgrades). Fails loudly if package.json and the lock disagree.
        run: npm ci

      - name: Typecheck
        # Uses the package.json script: tsc --noEmit with a bumped stack size —
        # plain tsc overflows on this app's heavy type graph (expected, not a bug).
        run: npm run typecheck

      - name: Self-checks
        # The pure-logic modules in services/ carry assert-based self-checks (no
        # framework, no fixtures — plain node with --experimental-strip-types).
        # They were only ever run by hand, which is the same as not running them:
        # each one pins a reconciliation or a ranking that fails SILENTLY when it
        # breaks, which is precisely the class this job exists to catch.
        run: |
          npm run test:library
          npm run test:todos
          npm run test:notifications
          npm run test:roll
          npm run test:search
          npm run test:quota
          # ⚠️ CALLED DIRECTLY, NOT AS AN npm SCRIPT, AND THAT IS DELIBERATE.
          # `runtimeVersion` is the `fingerprint` policy, and @expo/fingerprint
          # hashes **package.json's scripts block**. Adding `test:cover` there
          # changed the fingerprint on a JS-only round, which orphaned the OTA
          # update from the installed build — verified with `fingerprint:compare`,
          # where that one added line was the ENTIRE diff. A dev-only script must
          # never cost an EAS build. New self-checks go here, not in package.json.
          node --experimental-strip-types --no-warnings components/coverStyle.test.ts
          node --experimental-strip-types --no-warnings services/cardTitle.test.ts
          node --experimental-strip-types --no-warnings services/readFailure.test.ts
          node --experimental-strip-types --no-warnings components/tabBarSize.test.ts
          node --experimental-strip-types --no-warnings services/saveQuota.test.ts
          node --experimental-strip-types --no-warnings services/shareNotice.test.ts
          node --experimental-strip-types --no-warnings services/todoDates.test.ts
